<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11261B">
<meta name="description" content="วิเคราะห์หุ้นไทยและสหรัฐฯ พร้อมจุดซื้อ TP SL งบการเงิน ข่าว และปัจจัยมหภาค">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>หุ้นเด่น Stock Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — sticky top bar, one content column (max 1120px), bottom tab bar on phones; stock page = main column + side rail */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#EBEFE8; --ink:#0F1712; --ink-2:#56625B; --line:#DFE5DC;
  --accent:#C4EF3A; --accent-ink:#0F1712; --deep:#11261B; --deep-ink:#E9F5E4; --deep-2:#9DB8A6;
  --up:#0B9A55; --down:#E0464B; --warn:#B87D00; --up-bg:#E2F5EA; --down-bg:#FCE7E7; --warn-bg:#FBF0D6;
  --c1:#E0A100; --c2:#3D7BF5; --c3:#9A5CF0;
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Prompt",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0D0B; --surface:#131815; --surface-2:#1A201C; --ink:#EDF3EE; --ink-2:#98A49D; --line:#253029;
  --accent:#C4EF3A; --accent-ink:#0F1712; --deep:#16301F; --deep-ink:#E9F5E4; --deep-2:#93B09C;
  --up:#2DC97C; --down:#FF6B70; --warn:#E3A92B; --up-bg:#123323; --down-bg:#3A1A1C; --warn-bg:#352A10;
  --c1:#F2B825; --c2:#6B9BFF; --c3:#B88BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D0B; --surface:#131815; --surface-2:#1A201C; --ink:#EDF3EE; --ink-2:#98A49D; --line:#253029;
  --accent:#C4EF3A; --accent-ink:#0F1712; --deep:#16301F; --deep-ink:#E9F5E4; --deep-2:#93B09C;
  --up:#2DC97C; --down:#FF6B70; --warn:#E3A92B; --up-bg:#123323; --down-bg:#3A1A1C; --warn-bg:#352A10;
  --c1:#F2B825; --c2:#6B9BFF; --c3:#B88BFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--up);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--ink-2)} .warn{color:var(--warn)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-style:normal;color:var(--accent-ink);font-size:15px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{background:var(--ink);color:var(--surface)}
.search{margin-left:auto;position:relative;flex:0 1 260px;min-width:0}
.search input{width:100%;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);outline:none}
.search input:focus{border-color:var(--ink-2)}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(0,0,0,.12);overflow:hidden;z-index:40}
.sugg a{display:flex;gap:10px;padding:9px 12px;text-decoration:none;align-items:center}
.sugg a:hover,.sugg a.on{background:var(--surface-2)}
.bnav{display:none}
@media (max-width:820px){
  .tabs{display:none}
  .search{flex:1 1 auto}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11.5px;text-decoration:none;color:var(--ink-2)}
  .bnav a svg{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--ink);font-weight:600}
  .bnav a[aria-current="page"] svg{color:var(--up)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}
main{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.view{display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:600}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{max-width:75ch}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;border:1px solid var(--line);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sub-t{color:var(--ink-2);font-size:13px;margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-bg);color:var(--ink);font-size:13.5px}
.notice b{color:var(--warn);white-space:nowrap}
.notice.ok{background:var(--up-bg)} .notice.ok b{color:var(--up)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:0;text-decoration:none}
button.chip{cursor:pointer;padding:6px 13px;font-size:13.5px}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-buy2{background:var(--up);color:var(--surface)} .p-buy{background:var(--up-bg);color:var(--up)}
.p-hold{background:var(--surface-2);color:var(--ink-2)} .p-sell{background:var(--down-bg);color:var(--down)} .p-sell2{background:var(--down);color:var(--surface)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:13.5px}
.star{border:0;background:transparent;cursor:pointer;font-size:22px;line-height:1;color:var(--ink-2);padding:4px}
.star[aria-pressed="true"]{color:var(--warn)}

.hero{background:var(--deep);color:var(--deep-ink);border-radius:var(--r-lg);padding:22px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:18px;align-items:end}
.hero h1{color:var(--deep-ink)}
.hero .muted{color:var(--deep-2)}
.idx .v{font-family:var(--f-num);font-size:22px;font-weight:600}
.idx .s{font-size:12px;color:var(--deep-2)}
.idx .c-up{color:var(--accent)} .idx .c-dn{color:#FF8A8E}
@media (max-width:860px){.hero{grid-template-columns:1fr 1fr}.hero>div:first-child{grid-column:1/-1}}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) 84px 112px;gap:12px;align-items:center;padding:11px 6px;border-bottom:1px solid var(--line);text-decoration:none;border-radius:12px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:12px;background:var(--surface-2);color:var(--ink);flex:none}
.logo.big{width:52px;height:52px;border-radius:16px;font-size:14px}
.sym{font-family:var(--f-display);font-weight:600;font-size:15.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nm{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right}
.px .c{font-size:12.5px}
.row .sig{text-align:right}
.conf{font-size:11.5px;margin-top:3px;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--c,var(--ink-2))}
@media (max-width:560px){.row{grid-template-columns:40px minmax(0,1fr) auto}.row .spark{display:none}}
.mk{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.03em}

.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cell{border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left}
.cell .n{font-weight:600}
.cell .k{font-size:12.5px;color:var(--ink-2)}

.news{display:flex;flex-direction:column}
.ni{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.ni:last-child{border-bottom:0}
.ni .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.ni a.t{font-weight:600;font-size:15.5px;text-decoration:none;line-height:1.4}
.ni a.t:hover{text-decoration:underline}
.ni p{margin:0;color:var(--ink-2);font-size:14px}
.tier{font-weight:600;font-size:11px;padding:2px 7px;border-radius:6px}
.t1{background:var(--up-bg);color:var(--up)} .t2{background:var(--surface-2);color:var(--ink)} .t3{background:var(--warn-bg);color:var(--warn)}
.sent{font-size:12px;font-weight:600}
.empty{padding:28px 10px;text-align:center;color:var(--ink-2)}

.sp{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.sp-main,.sp-side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:980px){.sp{grid-template-columns:minmax(0,1fr)}}
.shead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.shead .big{font-family:var(--f-num);font-size:30px;font-weight:600}
.back{text-decoration:none;color:var(--ink-2);font-size:14px}
.chartbox{height:340px;position:relative}
.subc{height:110px;position:relative;margin-top:6px;border-top:1px dashed var(--line)}
.sublabel{position:absolute;left:8px;top:6px;z-index:3;font-size:11.5px;color:var(--ink-2);pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
.score{display:flex;gap:16px;align-items:center}
.ring{--p:50;--c:var(--up);width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-num);font-size:24px}
.bars{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.bar{display:grid;grid-template-columns:92px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:9px;background:var(--c,var(--up))}
.plan{display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.pl .k{font-weight:600;font-size:13.5px}
.pl .d{font-size:12.5px;color:var(--ink-2);text-align:right}
.pl .v{font-family:var(--f-num);font-weight:600;font-size:16px;text-align:right}
.pl.tp{box-shadow:inset 3px 0 0 var(--up)} .pl.sl{box-shadow:inset 3px 0 0 var(--down)} .pl.en{box-shadow:inset 3px 0 0 var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--ink-2);text-align:left;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tscroll{overflow-x:auto}
.vote{font-weight:600;font-size:12.5px;white-space:nowrap}
.mean{color:var(--ink-2);font-size:12px;font-weight:400;margin-top:2px;max-width:34ch}
.wide{min-width:620px}
@media (max-width:560px){.wide .mean{display:none}}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.field input,.field select{padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;min-width:0}
details summary{cursor:pointer;font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:16px;text-align:center;color:var(--ink-2);font-size:13.5px}
.drop.over{border-color:var(--up);background:var(--up-bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.factor{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.factor:last-child{border-bottom:0}
.arrow{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:18px}
.imp{display:inline-block;min-width:26px;text-align:center;font-weight:600;border-radius:6px;padding:2px 4px;font-size:12.5px}
.foot{font-size:12.5px;color:var(--ink-2);max-width:80ch}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.why{grid-template-columns:minmax(0,1fr)}}
.why h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.why ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.why li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;font-size:14px}
.why li::before{content:var(--m);font-weight:700;color:var(--mc)}
.why .pro li{--m:"+";--mc:var(--up)} .why .con li{--m:"−";--mc:var(--down)} .why .wait li{--m:"→";--mc:var(--warn)}
.why .tag{font-size:11.5px;color:var(--ink-2);margin-right:4px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:18px}
.stat .s{font-size:11.5px;color:var(--ink-2)}
.eq{width:100%;height:auto;display:block;margin-top:8px}
.method h2{margin-top:6px}
.method p,.method li{color:var(--ink);font-size:14.5px}
.method ul{padding-left:20px;margin:6px 0}
@media (prefers-reduced-motion:no-preference){.row,.cell,.btn{transition:background .15s ease,transform .15s ease}.cell:hover{transform:translateY(-2px)}}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:calc(40px*var(--fs,.36));background:var(--lb,var(--surface-2));color:var(--lf,var(--ink));flex:none;letter-spacing:-.02em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);line-height:1}
.logo.big{width:56px;height:56px;font-size:calc(56px*var(--fs,.36))}
.pill.sm{font-size:11px;padding:1px 8px;font-weight:600}
.cp{display:inline-block;font-family:var(--f-num);font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.cp-up{background:var(--up-bg);color:var(--up)} .cp-dn{background:var(--down-bg);color:var(--down)}
.pxv{font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--up);font-weight:600;cursor:pointer;text-decoration:underline}
.stabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.stabs::-webkit-scrollbar{display:none}
.stabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.stabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--up);font-weight:600}
.vh{background:var(--deep);color:var(--deep-ink);border-radius:var(--r-lg);padding:22px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.vh{grid-template-columns:minmax(0,1fr);padding:18px}}
.vword{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1.1;margin-top:4px;color:var(--accent)}
.vline{margin:8px 0 14px;font-size:16px;line-height:1.5}
.vmeta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--deep-2);margin-top:10px}
.vmeta b{color:var(--deep-ink)}
.gauge .gtrack{position:relative;height:10px;border-radius:9px;background:linear-gradient(90deg,#E0464B 0%,#E0464B 35%,#E3A92B 35%,#E3A92B 45%,#8A9A90 45%,#8A9A90 58%,#7FD08F 58%,#7FD08F 70%,#2DC97C 70%)}

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="core.js"></script>
<script>
"use strict";
/* ---------- small renderers ---------- */
const closes=R=>R.B?R.B.map(b=>b.c):(R.sp||[]);
function spark(R){const c=closes(R).slice(-60);if(c.length<2)return `<svg class="spark" width="84" height="30" aria-hidden="true"></svg>`;const mn=Math.min(...c),mx=Math.max(...c),w=84,h=30;const pts=c.map((v,i)=>`${(i/(c.length-1)*w).toFixed(1)},${(h-2-(v-mn)/((mx-mn)||1)*(h-4)).toFixed(1)}`).join(" ");const col=c.at(-1)>=c[0]?"var(--up)":"var(--down)";return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`}
// สีประจำแบรนด์ของแต่ละบริษัท [พื้น, ตัวอักษรบนโลโก้, สีตัวอักษร]
const BRAND={PTT:["#1E4E9C","PTT"],PTTEP:["#0B5FA5","EP"],KBANK:["#138F2D","K"],SCB:["#4E2A84","SCB"],ADVANC:["#84BD00","AIS","#0F1712"],GULF:["#F08A00","G"],DELTA:["#0072C6","Δ"],AOT:["#1B3E8A","AOT"],CPALL:["#F37021","7"],BDMS:["#0A3D7A","BDMS"],CPN:["#C8102E","C"],SCC:["#E31837","SCC"],
 AAPL:["#111111","A"],MSFT:["#F3F3F3","MS"],NVDA:["#76B900","NV","#0F1712"],AVGO:["#CC092F","B"],GOOGL:["#FFFFFF","G","#4285F4"],META:["#0866FF","∞"],AMZN:["#232F3E","a","#FF9900"],TSLA:["#E82127","T"],JPM:["#3B2A1E","JPM"],XOM:["#ED1B2D","XOM"],LLY:["#D52B1E","LLY"],KO:["#F40009","KO"]};
const MSFT_SVG=`<svg viewBox="0 0 20 20" width="52%" height="52%" aria-hidden="true"><rect width="9" height="9" fill="#F25022"/><rect x="11" width="9" height="9" fill="#7FBA00"/><rect y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>`;
function logo(s,big){const b=BRAND[s]||[`hsl(${hash(s)%360} 45% 38%)`,s.slice(0,3)];const txt=b[1],fs=txt.length>=4?.27:txt.length===3?.32:txt.length===2?.38:.48;
  return `<span class="logo${big?" big":""}" style="--lb:${b[0]};--lf:${b[2]||"#fff"};--fs:${fs}" aria-hidden="true">${s==="MSFT"?MSFT_SVG:esc(txt)}</span>`}
function mktOpen(m){try{const p=new Intl.DateTimeFormat("en-US",{timeZone:m==="TH"?"Asia/Bangkok":"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t)?.value,wd=g("weekday"),x=+g("hour")*60+ +g("minute");if(wd==="Sat"||wd==="Sun")return false;return m==="TH"?(x>=600&&x<750)||(x>=870&&x<990):(x>=570&&x<960)}catch{return false}}
const mktChip=m=>{const o=mktOpen(m);return `<span class="chip" title="ตามเวลาทำการปกติ ไม่รวมวันหยุด"><span class="dot" style="--c:${o?"var(--up)":"var(--ink-2)"}"></span>${m==="TH"?"SET":"ตลาดสหรัฐฯ"} ${o?"เปิดอยู่":"ปิดแล้ว"}</span>`};
const dataChip=R=>{if(R.sample)return `<span class="chip" style="background:var(--warn-bg);color:var(--warn)">ราคาจำลอง</span>`;if(S.px[R.st.s])return `<span class="chip">ไฟล์ที่นำเข้า · ${thDate(R.B.at(-1).t)}</span>`;const q=S.quotes?.q?.[R.st.s];return `<span class="chip" title="ราคาจาก Yahoo Finance อาจล่าช้า">${q?.ts?"ราคา "+new Date(q.ts*1000).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" · ล่าช้า ~15 นาที":"ราคาปิด "+thDate(R.B.at(-1).t)}</span>`};
const chgPill=(v,sym)=>`<span class="cp ${v>0?"cp-up":v<0?"cp-dn":""}"${sym?` data-qc="${esc(sym)}"`:""}>${pct(v)}</span>`;
const confTag=R=>`<div class="conf muted"><span class="dot" style="--c:${R.conf.c}"></span>เชื่อถือ: ${R.conf.t}</div>`;
/* ---------- งบการเงินรายไตรมาส ---------- */
const qLab=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return `Q${Math.ceil(m/3)}/${String((y+543)%100).padStart(2,"0")}`};
const yLab=d=>String(+d.slice(0,4)+543);
const mn=(v,m)=>v==null?"–":(Math.abs(v)>=1e9?(v/1e9).toLocaleString("en-US",{maximumFractionDigits:2})+(m==="TH"?" พันล้าน":"B"):(v/1e6).toLocaleString("en-US",{maximumFractionDigits:v>=1e8||v<=-1e8?0:1})+(m==="TH"?" ล้าน":"M"));
const gp=v=>v==null?`<span class="muted">–</span>`:`<span class="${cls(v)}">${pct(v,1)}</span>`;
function earnTag(R){const y=R.lite?R.fq?.[1]:R.f?.fs?.yoyN;return y==null?"":` · <span class="${cls(y)}">กำไร YoY ${pct(y,0)}</span>`}
async function loadFin(sym){if(S.fin[sym]!==undefined||S.finLoading?.has(sym))return;(S.finLoading??=new Set()).add(sym);
  const d=await J(HIST+"fin/"+encodeURIComponent(sym)+".json");S.finLoading.delete(sym);S.fin[sym]=d&&(d.q||d.a)?d:null;S.cache.delete(sym);
  if(route().sym===sym&&!document.querySelector("input:focus"))render()}
function barMini(F,key,m,col){const q=F.q,n=q.d.length,i0=Math.max(0,n-8),vals=q[key].slice(i0),labs=q.d.slice(i0);if(!vals.some(v=>v!=null))return `<p class="muted">ไม่มีข้อมูล</p>`;
  const W=320,H=150,pb=34,pt=18,mx=Math.max(0,...vals.map(v=>v??0)),mn0=Math.min(0,...vals.map(v=>v??0)),rg=(mx-mn0)||1,y=v=>pt+(mx-v)/rg*(H-pt-pb),bw=W/vals.length;
  return `<svg viewBox="0 0 ${W} ${H}" class="fbars" role="img" aria-label="กราฟรายไตรมาส"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${vals.map((v,i)=>{if(v==null)return "";const x=i*bw+bw*.18,w=bw*.64,top=Math.min(y(v),y(0)),h=Math.max(1.5,Math.abs(y(v)-y(0))),last=i===vals.length-1,c=v<0?"var(--down)":col;
    const yy=gr(v,q[key][i0+i-4]);return `<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="3" fill="${c}" opacity="${last?1:.55}"><title>${qLab(labs[i])}: ${mn(v,m)}${yy!=null?" · YoY "+pct(yy,1):""}</title></rect>${last?`<text x="${x+w/2}" y="${top-5}" text-anchor="middle" class="fl">${mn(v,m).replace(/ (ล้าน|พันล้าน)$/,"")}</text>`:""}<text x="${x+w/2}" y="${H-18}" text-anchor="middle" class="fx">${qLab(labs[i])}</text>${yy!=null?`<text x="${x+w/2}" y="${H-5}" text-anchor="middle" class="fy" fill="${yy>=0?"var(--up)":"var(--down)"}">${yy>=0?"+":""}${Math.round(yy)}%</text>`:""}`}).join("")}</svg>`}
function finSection(R){const st=R.st,F=S.fin[st.s];
  if(F===undefined){loadFin(st.s);return `<section class="card empty">กำลังโหลดงบการเงินรายไตรมาส…</section>`}
  if(!F)return `<section class="card"><h2 style="margin-bottom:6px">ผลประกอบการรายไตรมาส</h2><p class="muted" style="margin:0">ยังไม่มีงบของหุ้นนี้ ระบบดึงงบหมุนเวียนวันละราว 500 บริษัทตามมูลค่าตลาด จะมีภายในไม่กี่วัน</p></section>`;
  const fs=finStats(F),m=st.m,u=m==="TH"?"บาท":"ดอลลาร์",q=F.q,n=q.d.length,a=F.a,an=a?.d?.length||0;
  const tile=(k,v,sub)=>`<div><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const say=[];if(fs.yoyR!=null)say.push(`รายได้ไตรมาสล่าสุด${fs.yoyR>=0?"โต":"ลดลง"} ${pct(Math.abs(fs.yoyR),1).replace("+","")} จากไตรมาสเดียวกันปีก่อน`);if(fs.yoyN!=null)say.push(`กำไรสุทธิ${fs.yoyN>=0?"โต":"ลดลง"} ${pct(Math.abs(fs.yoyN),1).replace("+","")} YoY`);if(fs.qoqN!=null)say.push(`และ${fs.qoqN>=0?"เพิ่มขึ้น":"ลดลง"} ${pct(Math.abs(fs.qoqN),1).replace("+","")} จากไตรมาสก่อน`);
  const cols=q.d.map((d,i)=>i).slice(-6);
  const row=(lab,f)=>`<tr><td>${lab}</td>${cols.map(i=>`<td class="r num">${f(i)}</td>`).join("")}</tr>`;
  const v=(k,i)=>q[k]?.[i]??null;
  return `<section class="card"><div class="card-h"><div><h2>ผลประกอบการรายไตรมาส</h2><div class="sub-t">งบล่าสุด ${qLab(fs.last)} · หน่วย: ${u} · ข้อมูลจาก Yahoo Finance ดึงเมื่อ ${thDate(F.at)}</div></div></div>
   ${say.length?`<p style="margin:0 0 12px">${say.join(" ")}</p>`:""}
   <div class="stat">${tile("รายได้ "+qLab(fs.last),mn(fs.rq,m),`QoQ ${gp(fs.qoqR)} · YoY ${gp(fs.yoyR)}`)}${tile("กำไรสุทธิ "+qLab(fs.last),`<span class="${cls(fs.nq)}">${mn(fs.nq,m)}</span>`,`QoQ ${gp(fs.qoqN)} · YoY ${gp(fs.yoyN)}`)}${tile("อัตรากำไรสุทธิ (4 ไตรมาส)",fs.nm!=null?fs.nm.toFixed(1)+"%":"–",`ROE ${fs.roe!=null?fs.roe.toFixed(1)+"%":"–"}`)}${tile("EPS ไตรมาสล่าสุด",fs.eps!=null?fs.eps.toFixed(2):"–",`4 ไตรมาส ${fs.epsT!=null?fs.epsT.toFixed(2):"–"}`)}</div>
   ${n?`<div class="fcharts"><div><h3>รายได้</h3>${barMini(F,"rev",m,"var(--c2)")}</div><div><h3>กำไรสุทธิ</h3>${barMini(F,"ni",m,"var(--up)")}</div></div>
   <div class="tscroll" style="margin-top:12px"><table class="wide"><thead><tr><th>ไตรมาส</th>${cols.map(i=>`<th class="r">${qLab(q.d[i])}</th>`).join("")}</tr></thead><tbody>
    ${row("รายได้",i=>mn(v("rev",i),m))}${row("· QoQ",i=>gp(gr(v("rev",i),v("rev",i-1))))}${row("· YoY",i=>gp(gr(v("rev",i),v("rev",i-4))))}
    ${row("กำไรขั้นต้น",i=>mn(v("gp",i),m))}${row("กำไรจากการดำเนินงาน",i=>mn(v("op",i),m))}
    ${row("<b>กำไรสุทธิ</b>",i=>`<b class="${cls(v("ni",i))}">${mn(v("ni",i),m)}</b>`)}${row("· QoQ",i=>gp(gr(v("ni",i),v("ni",i-1))))}${row("· YoY",i=>gp(gr(v("ni",i),v("ni",i-4))))}
    ${row("อัตรากำไรสุทธิ",i=>v("rev",i)&&v("ni",i)!=null?(v("ni",i)/v("rev",i)*100).toFixed(1)+"%":"–")}${row("EPS",i=>v("eps",i)!=null?v("eps",i).toFixed(2):"–")}
    ${row("กระแสเงินสดจากการดำเนินงาน",i=>mn(v("ocf",i),m))}</tbody></table></div>`:""}</section>
  ${an?`<section class="card"><h2 style="margin-bottom:8px">งบรายปี</h2><div class="tscroll"><table class="wide"><thead><tr><th>ปี</th>${a.d.map(d=>`<th class="r">${yLab(d)}</th>`).join("")}</tr></thead><tbody>
    <tr><td>รายได้</td>${a.d.map((d,i)=>`<td class="r num">${mn(a.rev?.[i],m)}</td>`).join("")}</tr>
    <tr><td>· เติบโต</td>${a.d.map((d,i)=>`<td class="r num">${gp(gr(a.rev?.[i],a.rev?.[i-1]))}</td>`).join("")}</tr>
    <tr><td><b>กำไรสุทธิ</b></td>${a.d.map((d,i)=>`<td class="r num"><b class="${cls(a.ni?.[i])}">${mn(a.ni?.[i],m)}</b></td>`).join("")}</tr>
    <tr><td>· เติบโต</td>${a.d.map((d,i)=>`<td class="r num">${gp(gr(a.ni?.[i],a.ni?.[i-1]))}</td>`).join("")}</tr>
    <tr><td>อัตรากำไรสุทธิ</td>${a.d.map((d,i)=>`<td class="r num">${a.rev?.[i]&&a.ni?.[i]!=null?(a.ni[i]/a.rev[i]*100).toFixed(1)+"%":"–"}</td>`).join("")}</tr>
    <tr><td>ROE</td>${a.d.map((d,i)=>`<td class="r num">${a.eq?.[i]>0&&a.ni?.[i]!=null?(a.ni[i]/a.eq[i]*100).toFixed(1)+"%":"–"}</td>`).join("")}</tr>
    <tr><td>EPS</td>${a.d.map((d,i)=>`<td class="r num">${a.eps?.[i]!=null?a.eps[i].toFixed(2):"–"}</td>`).join("")}</tr></tbody></table></div></section>`:""}
  <section class="card"><h2 style="margin-bottom:8px">ฐานะการเงินและกระแสเงินสด</h2><div class="stat">
   ${tile("เงินสด",mn(fs.cash,m),"ล่าสุด")}${tile("หนี้สินที่มีภาระดอกเบี้ย",mn(fs.debt,m),`D/E ${fs.de!=null?fs.de.toFixed(2)+"×":"–"}`)}${tile("ส่วนของผู้ถือหุ้น",mn(fs.eq,m),`สภาพคล่อง ${fs.cr!=null?fs.cr.toFixed(2)+"×":"–"}`)}${tile("กระแสเงินสดอิสระ (4 ไตรมาส)",`<span class="${cls(fs.fcf)}">${mn(fs.fcf,m)}</span>`,`ดำเนินงาน ${mn(fs.ocf,m)} · ลงทุน ${mn(fs.capex,m)}`)}</div></section>`}
function rowHTML(R){const st=R.st,fav=S.watch.includes(st.s);return `<a class="row" href="#s-${esc(st.s)}">${logo(st.s)}<div style="min-width:0"><div class="sym">${esc(st.s)}${fav?`<span class="warn" aria-label="รายการโปรด">★</span>`:""}<span class="pill sm ${R.v[1]}">${R.v[0]}</span></div><div class="nm">${esc(st.n)}${earnTag(R)}</div></div>${spark(R)}<div class="px"><div class="num pxv" data-q="${esc(st.s)}">${cur(st.m)}${fmt(R.last)}</div>${chgPill(R.chg,st.s)}</div></a>`}
function sentTag(s){return s>0?`<span class="sent up">● บวก</span>`:s<0?`<span class="sent down">● ลบ</span>`:`<span class="sent muted">● กลาง</span>`}
function nfx(x){const L=newsLinks(x).via;if(!L.length)return "";return `<div class="nfx">${L.map(([f,e])=>{const ef=effOf(f,e);return `<span><b>${esc(f.short||f.name)} ${e>0?"▲":"▼"}</b>${ef.help.length?` → หนุน${ef.help.slice(0,4).map(s=>SECTORS[s].th).join(", ")}`:""}${ef.hurt.length?` · กดดัน${ef.hurt.slice(0,4).map(s=>SECTORS[s].th).join(", ")}`:""}</span>`}).join("")}</div>`}
function newsHTML(list,limit){if(!list.length)return `<div class="empty">${S.dbState==="loading"?"กำลังโหลดข่าว…":S.dbState==="off"?"โหลดข่าวไม่สำเร็จ ลองรีเฟรชหน้า":"ยังไม่มีข่าวที่เกี่ยวข้อง"}</div>`;
  return `<div class="news">${list.slice(0,limit||999).map(x=>`<article class="ni"><div class="meta"><span class="tier t${x.tier||3}">${["","ระดับ 1","ระดับ 2","ระดับ 3"][x.tier||3]}</span><b style="color:var(--ink)">${esc(x.source)}</b><span>${x.approx?thMonth(x.date):thDate(x.date)}</span>${sentTag(x.sentiment)}</div><a class="t" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.titleTh||x.title)}</a>${x.summary?`<p>${esc(x.summary)}</p>`:""}${nfx(x)}<div class="chips">${(x.tickers||[]).map(t=>`<a class="chip" href="#s-${esc(t)}">${esc(t)}</a>`).join("")}${(x.sectors||[]).map(s=>`<span class="chip">${esc(SECTORS[s]?.th||s)}</span>`).join("")}</div></article>`).join("")}</div>`}
const sortedNews=()=>[...S.news].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
function sampleNotice(){if(S.live)return `<div class="notice ok" role="note"><b>ราคาจริง</b><span>จาก Yahoo Finance อัปเดตทุก ~10 นาทีช่วงตลาดเปิด หุ้นไทยล่าช้าราว 15–20 นาที หุ้นสหรัฐฯ ไม่กี่นาที ไม่ใช่ราคาสำหรับส่งคำสั่งซื้อขาย</span></div>`;return `<div class="notice" role="note"><b>ข้อมูลจำลอง</b><span>ยังโหลดราคาจริงไม่ได้ ตัวเลขในหน้านี้เป็นข้อมูลจำลอง</span></div>`}
function statBox(k,v,s,c){return `<div><div class="k">${k}</div><div class="v ${c||""}">${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`}

/* ---------- views ---------- */
function greet(){let h=12;try{h=+new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Bangkok",hour:"2-digit",hourCycle:"h23"}).format(new Date())}catch{}return h<12?"อรุณสวัสดิ์":h<17?"สวัสดีตอนบ่าย":"สวัสดีตอนเย็น"}
function todayTh(){try{return new Intl.DateTimeFormat("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Bangkok"}).format(new Date())}catch{return ""}}
function sparkArea(R,w,h,days=90){const c=closes(R).slice(-days);if(c.length<2)return "";const mn=Math.min(...c),mx=Math.max(...c);const pts=c.map((v,i)=>[i/(c.length-1)*w,h-3-(v-mn)/((mx-mn)||1)*(h-8)]);const up=c.at(-1)>=c[0],col=up?"var(--up)":"var(--down)",id="g"+R.st.s.replace(/\W/g,"")+w;
  const d=pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${w},${h}L0,${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`}
function effOf(f,d){const help=[],hurt=[];Object.entries(f.impacts||{}).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).forEach(([sec,k])=>{const e=d*k;if(e>0)help.push(sec);else if(e<0)hurt.push(sec)});return{help,hurt}}
const factorEffects=f=>effOf(f,sgn(fx(f)));

function vMethod(){
  const co=lsGet("cost")||{};
  return `<div><h1>วิธีคิดคะแนนและการทดสอบย้อนหลัง</h1><p class="muted" style="margin:4px 0 0">ทุกตัวเลขในเว็บนี้คำนวณในเบราว์เซอร์ของคุณจากสูตรด้านล่าง ไม่มีกล่องดำ</p></div>
  <section class="card method"><h2>1. คะแนนรวม (0–100)</h2><ul><li><b>เทคนิค 50%</b> อินดิเคเตอร์ ${VOTES.length} ตัว แต่ละตัวโหวต −2 ถึง +2 คูณน้ำหนัก แล้วแปลงเป็น 0–100</li><li><b>งบการเงิน 30%</b> 9 เกณฑ์ ผ่าน = 1, พอใช้ = 0.5, ไม่ผ่าน = 0</li><li><b>บริบท 20%</b> ข่าว (ถ่วงตามระดับความน่าเชื่อถือของแหล่งข่าว) + ปัจจัยมหภาคของ sector + ความแข็งแกร่งเทียบหุ้นอื่นในตลาดเดียวกัน 3 เดือน</li></ul><p>เกณฑ์: 70+ ซื้อ (แรง) · 58+ น่าซื้อ · 45+ ถือ/รอ · 35+ ระวัง · ต่ำกว่านั้น หลีกเลี่ยง</p></section>
  <section class="card method"><h2>2. ทดสอบย้อนหลังแบบไม่โกงตัวเอง</h2><ul>
   <li><b>ไม่แอบดูอนาคต:</b> สัญญาณเกิดที่ราคาปิดวันนี้ แล้วเข้าซื้อที่ราคาเปิดวันถัดไป กราฟรายสัปดาห์ใช้เฉพาะสัปดาห์ที่ปิดแล้ว จุดกลับตัว (pivot) ต้องมีแท่งยืนยัน 3 แท่ง</li>
   <li><b>แยกช่วงข้อมูล:</b> 70% แรกใช้สร้างและปรับน้ำหนัก 30% หลังใช้ทดสอบเท่านั้น ผลที่ใช้ตัดสินความน่าเชื่อถือคือผลในช่วงทดสอบ</li>
   <li><b>กติกาออก:</b> SL ${RULES.sl} ATR, TP ${RULES.tp} ATR (= 2R), ถือไม่เกิน ${RULES.hold} วัน ถ้าแท่งเดียวกันแตะทั้ง SL และ TP นับเป็นขาดทุน ถ้าเปิดกระโดดผ่าน SL ใช้ราคาเปิดจริง</li>
   <li><b>หักต้นทุน</b> ทั้งขาซื้อและขาย และเทียบกับการซื้อแล้วถือ (Buy & Hold) ในช่วงเดียวกัน</li>
   <li><b>ช่วงความเชื่อมั่น 95%</b> ของอัตราชนะ (Wilson) ถ้าจำนวนไม้น้อย ช่วงจะกว้าง แปลว่ายังสรุปไม่ได้</li></ul>
   <div class="calc" style="max-width:420px;margin-top:10px"><label class="field">ต้นทุนต่อขา หุ้นไทย (%)<input id="costTH" type="number" step="0.01" min="0" value="${co.TH??DEF_COST.TH}"></label><label class="field">ต้นทุนต่อขา หุ้นสหรัฐฯ (%)<input id="costUS" type="number" step="0.01" min="0" value="${co.US??DEF_COST.US}"></label></div></section>
  <section class="card method"><h2>3. ปรับน้ำหนักอินดิเคเตอร์ตามหุ้นแต่ละตัว</h2><p>อินดิเคเตอร์แต่ละตัวถูกทดสอบแบบเดี่ยวในช่วงสร้างโมเดล ตัวที่เคยทำกำไรได้น้ำหนักเพิ่ม (สูงสุด 2 เท่า) ตัวที่ขาดทุนถูกลดน้ำหนัก (ต่ำสุด 0.2 เท่า) ระบบจะใช้น้ำหนักปรับใหม่เฉพาะเมื่อมันดีกว่าน้ำหนักมาตรฐานในช่วงสร้างโมเดล แล้วเอาไปพิสูจน์ในช่วงทดสอบอีกครั้ง การจำกัดเพดานแบบนี้ป้องกันการปรับจนพอดีกับอดีตเกินไป (overfitting)</p></section>
  <section class="card method"><h2>4. ข่าวส่งผลต่อหุ้นอย่างไร</h2><ul><li><b>ทางตรง:</b> ข่าวที่พูดถึงหุ้นตัวนั้น (น้ำหนักเต็ม) หรือกลุ่มของมัน (ครึ่งหนึ่ง) ใช้ทิศทางบวก/กลาง/ลบของข่าว</li><li><b>ผ่านปัจจัย:</b> ข่าวที่ทำให้ปัจจัยขยับ เช่น “bond yield สหรัฐฯ ลดลง” จะส่งผลต่อทุกหุ้นที่อ่อนไหวกับปัจจัยนั้น เช่น หนุนกลุ่มเทคและอสังหาฯ</li><li><b>ปรับทิศทางของปัจจัย:</b> ทิศทางที่ใช้จริง = ข้อมูลล่าสุดของปัจจัย (เช่น ระดับ yield) ผสมกับข่าวที่ผูกกับปัจจัยนั้น</li><li><b>ถ่วงน้ำหนักทุกข่าว</b> ตามระดับแหล่งข่าว (1.0 / 0.7 / 0.4) และความสด (น้ำหนักลดครึ่งทุก 21 วัน)</li></ul></section>
  <section class="card method"><h2>5. ระดับความน่าเชื่อถือ</h2><ul><li><b>สูง:</b> ช่วงทดสอบมี 8 ไม้ขึ้นไป กำไรเฉลี่ยเกิน +0.15R ต่อไม้ Profit factor 1.3 ขึ้นไป และช่วงสร้างโมเดลก็กำไร</li><li><b>ปานกลาง:</b> กำไรทั้งสองช่วงแต่ขอบความได้เปรียบบาง</li><li><b>ต่ำ:</b> สัญญาณน้อยกว่า 5 ไม้ หรือขาดทุนในช่วงทดสอบ</li></ul></section>
  <section class="card method"><h2>6. ข้อจำกัดที่ควรรู้</h2><ul><li>อินดิเคเตอร์ทางเทคนิคส่วนใหญ่ให้อัตราชนะราว 40–55% กำไรมาจากการให้ไม้ที่ชนะได้มากกว่าไม้ที่แพ้ (R:R) และการตัดขาดทุนอย่างมีวินัย</li><li>ผลในอดีตไม่รับประกันอนาคต โดยเฉพาะเมื่อสภาพตลาดเปลี่ยน</li><li>งบการเงินตัวอย่างต้องแทนด้วยตัวเลขจากงบจริง (SET, 56-1 One Report, 10-K/10-Q) ก่อนใช้งาน</li><li>เครื่องมือนี้ช่วยคัดกรองและวางแผน ไม่ใช่คำแนะนำการลงทุน</li></ul></section>`;
}
function eqSVG(R){
  const B=R.B,st=RULES.warm,n=B.length-1,W=640,H=170,pl=44,pr=8,pt=10,pb=22,tr=R.model.trades;
  const x=i=>pl+(i-st)/(n-st)*(W-pl-pr);
  const bh=[];for(let i=st;i<=n;i+=2)bh.push([i,B[i].c/B[st].c]);bh.push([n,B[n].c/B[st].c]);
  const eq=[[st,1]];let e=1;for(const t of tr){eq.push([t.i,e]);e*=1+t.ret;eq.push([t.x,e])}eq.push([n,e]);
  const all=bh.map(p=>p[1]).concat(eq.map(p=>p[1])),mn=Math.min(...all,1),mx=Math.max(...all,1),y=v=>pt+(1-(v-mn)/((mx-mn)||1))*(H-pt-pb);
  const path=a=>a.map((p,k)=>`${k?"L":"M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const sx=x(R.split);
  return `<svg class="eq" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟผลตอบแทนสะสมเทียบซื้อแล้วถือ">
   <rect x="${sx}" y="${pt}" width="${W-pr-sx}" height="${H-pt-pb}" fill="var(--surface-2)"/>
   <line x1="${pl}" x2="${W-pr}" y1="${y(1)}" y2="${y(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>
   <text x="${pl-6}" y="${y(mx)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${pct((mx-1)*100,0)}</text>
   <text x="${pl-6}" y="${y(1)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">0%</text>
   <text x="${pl-6}" y="${y(mn)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${pct((mn-1)*100,0)}</text>
   <text x="${pl+4}" y="${H-6}" font-size="10" fill="var(--ink-2)">ช่วงสร้างโมเดล ${thMonth(B[st].t)}</text>
   <text x="${sx+4}" y="${H-6}" font-size="10" fill="var(--ink-2)">ช่วงทดสอบ ${thMonth(B[R.split].t)}</text>
   <path d="${path(bh)}" fill="none" stroke="var(--ink-2)" stroke-width="1.2" opacity=".7"/>
   <path d="${path(eq)}" fill="none" stroke="var(--up)" stroke-width="2"/>
   <circle cx="${x(n)}" cy="${y(e)}" r="3.5" fill="var(--up)"/></svg>
   <div class="legend"><span style="--c:var(--up)">ระบบนี้ (หักต้นทุนแล้ว)</span><span style="--c:var(--ink-2)">ซื้อแล้วถือ</span><span style="--c:var(--surface-2)">พื้นเทา = ช่วงทดสอบ</span></div>`;
}

function tSum(R){const P=R.plan,dist=v=>pct((v/R.last-1)*100,1),W=R.why,c=cur(R.st.m),N=R.ns;

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/"/g,"");const mul=/k$/i.test(s)?1e3:/m$/i.test(s)?1e6:/b$/i.test(s)?1e9:1;s=s.replace(/[kmb]$/i,"").replace(/,/g,"");return parseFloat(s)*mul}
function splitCsv(line){const o=[];let q=false,c="";for(const ch of line){if(ch==='"'){q=!q;continue}if(ch===","&&!q){o.push(c);c="";continue}c+=ch}o.push(c);return o}
function parseDate(s){s=String(s).trim().replace(/"/g,"");if(/^\d{9,11}$/.test(s))return new Date(+s*1000).toISOString().slice(0,10);let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);if(m){const a=+m[1],b=+m[2];const[mo,da]=a>12?[b,a]:[a,b];return `${m[3]}-${String(mo).padStart(2,"0")}-${String(da).padStart(2,"0")}`}const d=new Date(s);return isNaN(d)?null:new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function parseCsv(text){
  const lines=text.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)throw new Error("ไฟล์ว่างหรือไม่มีแถวข้อมูล");
  const hd=splitCsv(lines[0]).map(h=>h.trim().toLowerCase().replace(/"/g,""));const find=(...ks)=>hd.findIndex(h=>ks.some(k=>h===k||h.startsWith(k)));
  const iD=find("date","time","วันที่"),iO=find("open","เปิด"),iH=find("high","สูงสุด"),iL=find("low","ต่ำสุด");let iC=hd.indexOf("close");if(iC<0)iC=find("close","price","ล่าสุด","ปิด");const iV=find("volume","vol","ปริมาณ");
  if([iD,iO,iH,iL,iC].some(i=>i<0))throw new Error("ไม่พบคอลัมน์ Date, Open, High, Low, Close ในบรรทัดแรก");
  const bars=[];for(const ln of lines.slice(1)){const c=splitCsv(ln);const t=parseDate(c[iD]);const r=[t,parseNum(c[iO]),parseNum(c[iH]),parseNum(c[iL]),parseNum(c[iC]),iV>=0?parseNum(c[iV])||0:0];if(t&&r.slice(1,5).every(x=>isFinite(x)&&x>0))bars.push(r)}
  bars.sort((a,b)=>a[0].localeCompare(b[0]));const ded=bars.filter((b,i)=>!i||b[0]!==bars[i-1][0]);
  if(ded.length<120)throw new Error(`ได้ข้อมูล ${ded.length} วัน ต้องมีอย่างน้อย 120 วันทำการ`);
  return ded.slice(-1500).map(r=>r.map((x,i)=>i&&i<5?+x.toFixed(4):x));
}

/* ---------- accuracy: rating calibration + parameter search ---------- */
function corr(a,b){const n=a.length;if(n<3)return 0;let ma=0,mb=0;for(let i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;let sab=0,sa=0,sb=0;for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;sab+=x*y;sa+=x*x;sb+=y*y}return sa&&sb?sab/Math.sqrt(sa*sb):0}
function calib(){
  const H=20,bins=[[-101,-40,"ต่ำมาก (< −40)"],[-40,-10,"ต่ำ (−40 ถึง −10)"],[-10,20,"กลาง (−10 ถึง 20)"],[20,50,"สูง (20 ถึง 50)"],[50,101,"สูงมาก (> 50)"]];
  const agg=w=>bins.map(b=>({lab:b[2],lo:b[0],hi:b[1],n:0,sum:0,pos:0}));const A={is:agg(),oos:agg()},sc={is:[],oos:[]},fr={is:[],oos:[]},ic=VOTES.map(()=>({x:[],y:[]}));let stocks=0,real=0;
  const per=[];
  for(const st of allStocks().filter(s=>!s.uni||hasBars(s))){const R=analyze(st);stocks++;if(!R.sample)real++;const c=R.I.c,arr=R.sStd,n=c.length;
    for(let i=RULES.warm;i<n-H;i++){const f=(c[i+H]/c[i]-1)*100,s=arr[i],k=i<R.split?"is":"oos";const b=A[k].find(b=>s>=b.lo&&s<b.hi);if(b){b.n++;b.sum+=f;if(f>0)b.pos++}
      if(i%3===0){sc[k].push(s);fr[k].push(f);if(k==="is")R.V[i].forEach((v,j)=>{if(v!=null){ic[j].x.push(v);ic[j].y.push(f)}})}}}
  // ค้นหาค่าที่ดีที่สุด: ใช้ช่วงสร้างระบบเลือก แล้ววัดผลจริงในช่วงทดสอบ
  const grid=[];for(const thr of [20,30,40,50])for(const sl of [1.5,2,3])for(const tp of [1,1.5,2,3,4])grid.push({thr,sl,tp,wk:true});
  const all=allStocks().filter(s=>!s.uni||hasBars(s)).map(analyze);
  const res=grid.map(g=>{const P={...RULES,...g};let is=[],oos=[];for(const R of all){const a=R.sStd,I=R.I,sig=i=>a[i-1]<g.thr&&a[i]>=g.thr&&(!g.wk||I.wk[i]>=0);is=is.concat(simulate(R.B,I,sig,0,R.split,R.st.m,P));oos=oos.concat(simulate(R.B,I,sig,R.split,R.B.length,R.st.m,P))}return{g,is:stats(is),oos:stats(oos)}});
  const cur=res.find(r=>r.g.thr===RULES.thr&&r.g.sl===RULES.sl&&r.g.tp===RULES.tp&&r.g.wk===(RULES.wk!==false));
  const best=res.filter(r=>r.is.n>=30).sort((a,b)=>b.is.exp-a.is.exp);
  const hiwin=res.filter(r=>r.is.n>=30&&r.is.win>=65&&r.is.exp>0).sort((a,b)=>b.is.exp-a.is.exp);
  const pbs={is:[],oos:[]};for(const R of all){for(const t of R.pb.trades)(t.i<R.split?pbs.is:pbs.oos).push(t)}
  return{hiwin:hiwin.slice(0,4),pb:{is:stats(pbs.is),oos:stats(pbs.oos)},A,ic:VOTES.map((v,j)=>({name:v.name,ic:corr(ic[j].x,ic[j].y),n:ic[j].x.length})).sort((a,b)=>b.ic-a.ic),icAll:{is:corr(sc.is,fr.is),oos:corr(sc.oos,fr.oos)},best:best.slice(0,6),cur,stocks,real,H};
}
function vAccuracy(){
  if(!S.calib){setTimeout(()=>{S.calib=calib();if(route().v==="accuracy")render()},30);return `<h1>ความแม่นยำของ rating</h1><div class="card empty">กำลังทดสอบย้อนหลังกับหุ้นทุกตัว…</div>`}
  const C=S.calib,bar=(v,mx)=>`<span class="hb"><i class="${v>=0?"pos":"neg"}" style="width:${Math.min(50,Math.abs(v)/mx*50)}%"></i></span>`;
  const mx=Math.max(.5,...["is","oos"].flatMap(k=>C.A[k].map(b=>b.n?Math.abs(b.sum/b.n):0)));
  const tbl=k=>C.A[k].map(b=>{const a=b.n?b.sum/b.n:0;return `<tr><td>${b.lab}</td><td class="r num ${cls(a)}">${b.n?pct(a,2):"–"}</td><td>${bar(a,mx)}</td><td class="r num">${b.n?(b.pos/b.n*100).toFixed(0)+"%":"–"}</td><td class="r num muted">${b.n.toLocaleString()}</td></tr>`}).join("");
  const mono=k=>{const a=C.A[k].filter(b=>b.n>30).map(b=>b.sum/b.n);let up=0;for(let i=1;i<a.length;i++)if(a[i]>a[i-1])up++;return a.length>1?up/(a.length-1):0};
  const verdictTxt=C.icAll.oos>.05&&mono("oos")>=.75?["ใช้ได้","up","คะแนนสูงตามมาด้วยผลตอบแทนที่ดีกว่าจริงในช่วงทดสอบ"]:C.icAll.oos>0?["พอใช้ แต่ยังอ่อน","warn","มีความสัมพันธ์เป็นบวกแต่น้อย ใช้ประกอบกับปัจจัยอื่น อย่าใช้ตัดสินใจเดี่ยวๆ"]:["ยังไม่น่าเชื่อถือ","down","คะแนนสูงไม่ได้ตามมาด้วยผลตอบแทนที่ดีกว่าในช่วงทดสอบ"];
  const B=C.best[0],fmtG=g=>`เข้าเมื่อคะแนน ≥ ${g.thr} · SL ${g.sl} ATR · TP ${g.tp} ATR · ${g.wk?"กรองด้วยกราฟสัปดาห์":"ไม่กรองสัปดาห์"}`;

  return `<div><h1>ความแม่นยำของ rating</h1><p class="muted" style="margin:4px 0 0">ทดสอบกับหุ้น ${C.stocks} ตัว (ราคาจริง ${C.real} ตัว) ทุกวันย้อนหลัง: ถ้าซื้อวันนั้นแล้วถือ ${C.H} วันทำการ ผลตอบแทนเป็นอย่างไรตามระดับคะแนนเทคนิค</p></div>
  ${C.real?"":`<div class="notice"><b>ข้อมูลจำลอง</b><span>ผลในหน้านี้จะมีความหมายเมื่อเว็บได้ราคาจริงแล้วเท่านั้น</span></div>`}
