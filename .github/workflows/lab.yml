name: strategy-lab
# ห้องทดลองกลยุทธ์ของฝ่ายเทคนิค: ทุกวันอาทิตย์ ลองกลยุทธ์ใหม่ ~1,000 แบบต่อตลาด backtest 10 ปี แล้วทดลองเทรดก่อนใช้จริง (รายละเอียดใน scripts/lab.js)
# ผล → data/hist/lab.json (branch hist) · แบบที่ชนะกลยุทธ์ปัจจุบันทั้งช่วงสร้างและช่วงทดสอบ 2 สัปดาห์ติดจะถูกใช้จริง
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      m:
        default: ALL
      tf:
        default: ALL
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Data
        run: |
          mkdir -p data/hist
          git fetch origin gh-pages --depth=1 && git show origin/gh-pages:data/universe.json > data/universe.json && (git show origin/gh-pages:data/calib.json > data/calib.json || true)
          git fetch origin hist --depth=1 && git --work-tree=data/hist checkout origin/hist -- . && git reset -q
      - name: Daily prices 10 years (for the daily backtest)
        run: python3 research/hist10_fetch.py data 2>&1 | tail -2
      - name: Hourly prices for 4H / 1H (~2 years, the most free sources provide)
        run: OUTDIR=h1 python3 research/intra_fetch.py data 2>&1 | tail -3
      - name: Backtest candidates (daily 10 years · 4H/1H 2 years) + paper-trading book
        env:
          LABDUMP: mcMin,tv
        run: for tf in $( [ "${{ github.event.inputs.tf || 'ALL' }}" = ALL ] && echo D 4H 1H || echo "${{ github.event.inputs.tf }}" ); do for m in $( [ "${{ github.event.inputs.m || 'ALL' }}" = ALL ] && echo TH US || echo "${{ github.event.inputs.m }}" ); do node --max-old-space-size=6500 scripts/lab.js data $m $tf; done; done
      - name: Save lab.json to branch hist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp data/hist/lab.json /tmp/lab.json
          for k in 1 2 3; do
            rm -rf _h && git clone -q --depth=1 -b hist "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" _h
            cp /tmp/lab.json _h/lab.json && cd _h && git add lab.json
            git -c user.name="stockdesk-bot" -c user.email="actions@users.noreply.github.com" commit -qm "lab $(date -u +%F)" && git push -q origin hist && exit 0
            cd .. && sleep 15
          done
          exit 1
