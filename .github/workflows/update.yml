name: update-data
on:
  schedule:
    # รอบใหญ่ดึงงบการเงินใหม่ วันละครั้งหลังตลาดสหรัฐฯ ปิด (ช่วงตลาดเปิดใช้งาน live.yml)
    - cron: "37 21 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "ดึงงบการเงินใหม่ด้วย (1 = ใช่)"
        default: "1"
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous data
        run: |
          git fetch origin gh-pages --depth=1 || true
          git checkout origin/gh-pages -- data 2>/dev/null || true
          git fetch origin hist --depth=1 && mkdir -p data/hist && git --work-tree=data/hist checkout origin/hist -- . && git reset -q || true
          git fetch origin intra --depth=1 && mkdir -p data/intra && git --work-tree=data/intra checkout origin/intra -- . && git reset -q || true
          git fetch origin intra15 --depth=1 && mkdir -p data/intra15 && git --work-tree=data/intra15 checkout origin/intra15 -- . && git reset -q || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test (stop before publishing if core logic is broken)
        run: python scripts/tests.py
      - name: Fetch market data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ github.event.inputs.full || (github.event.schedule == '37 21 * * 1-5' && '1') || '0' }}
        run: python scripts/update.py
      - name: Check the live site (nightly)
        if: ${{ github.event.inputs.full == '1' || github.event.schedule == '37 21 * * 1-5' }}
        continue-on-error: true
        run: |
          npm i --no-save --silent playwright@1.48.2 && npx playwright install --with-deps chromium > /dev/null 2>&1
          node scripts/ux_check.js
      - name: Publish site with data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh
