name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance
      - run: python scripts/probe.py
      - run: |
          mkdir _p && cp probe.json _p/ && cd _p && git init -q -b probe && git add -A && git -c user.name=bot -c user.email=a@b commit -qm p && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
