name: live-quotes
on:
  schedule:
    # รอบสั้นทุก 30 นาทีเฉพาะช่วงตลาดเปิด (ไทย 10:00–16:30 · สหรัฐฯ 21:30–04:00 เวลาไทย) งานละไม่เกิน ~10 นาที
    # ไม่รันต่อเนื่องทั้งวัน: GitHub Actions ไม่อนุญาตให้ใช้เป็นเซิร์ฟเวอร์ที่ทำงานตลอดเวลา
    - cron: "5,35 3-9 * * 1-5"
    - cron: "5,35 14-20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous data
        run: |
          git fetch origin gh-pages --depth=1 || true
          git checkout origin/gh-pages -- data 2>/dev/null || true
          git fetch origin hist --depth=1 && mkdir -p data/hist && git --work-tree=data/hist checkout origin/hist -- . && git reset -q || true
          git fetch origin intra --depth=1 && mkdir -p data/intra && git --work-tree=data/intra checkout origin/intra -- . && git reset -q || true
          git fetch origin intra15 --depth=1 && mkdir -p data/intra15 && git --work-tree=data/intra15 checkout origin/intra15 -- . && git reset -q || true
          # จด hash ของไฟล์ที่ดึงมา ตอนเผยแพร่จะส่งเฉพาะไฟล์ที่งานนี้แก้ (scripts/sd/datasync.py)
          python3 scripts/sd/datasync.py mark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Self-test (stop before publishing if core logic is broken)
        run: python scripts/tests.py
      - name: Stream quotes while markets are open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SETTRADE_APP_ID: ${{ secrets.SETTRADE_APP_ID }}
          SETTRADE_APP_SECRET: ${{ secrets.SETTRADE_APP_SECRET }}
          SETTRADE_APP_CODE: ${{ secrets.SETTRADE_APP_CODE }}
          SETTRADE_BROKER_ID: ${{ secrets.SETTRADE_BROKER_ID }}
        run: MAX_RUN=600 python -u scripts/live.py
