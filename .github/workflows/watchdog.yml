name: live-watchdog
# ยามเฝ้างานราคาสด: ทุก 20 นาทีตรวจว่างานราคาสด (live-quotes) กำลังรันหรือรอคิวอยู่ไหม
# GitHub บางครั้งเลื่อนหรือข้ามรอบที่ตั้งเวลาไว้ ถ้าไม่มีงานเลยจะสั่งรันทันที ราคาและข่าวจะได้อัปเดตต่อเนื่องไม่มีช่วงหาย
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start live-quotes if nothing is running or queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w live.yml -L 10 --json status -q '[.[]|select(.status!="completed")]|length' || echo 1)
          echo "live runs running/queued: $n"
          if [ "$n" = "0" ]; then gh workflow run live.yml -R "$GITHUB_REPOSITORY" --ref main && echo "started live-quotes" || true; fi
